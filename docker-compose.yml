services:
  mysql:
    image: mysql:8.0
    container_name: crawagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crawagent}
      MYSQL_USER: ${MYSQL_USER:-crawagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crawagent}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crawagent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: crawagent-backend
    restart: unless-stopped
    environment:
      # 数据库/缓存指向 compose 内部服务
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-crawagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crawagent}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crawagent}
      REDIS_URL: redis://redis:6379/0
      # 模型配置（根目录 .env 填充后自动透传，缺省走默认值）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      MOCK_MODE: ${MOCK_MODE:-false}
      # 应用
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_DIR: /app/data
    volumes:
      - crawagent_data:/app/data
      - crawagent_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: crawagent-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  crawagent_data:
  crawagent_logs:
