# Phase 4.3 — docker-compose.yml
#
# 一键启动：
#   1. 前端静态资源（可选，二选一）：
#      A) 已构建好 web/dist → 直接 docker compose up（后端容器内置 web/dist）
#      B) 独立前端容器：取消 frontend 服务注释，先 cd web && npm run build
#   2. 后端 + 定时调度：docker compose up -d
#   3. 健康检查：curl http://localhost:8006/docs
#   4. 数据持久化：data/ output/ downloads/ 都是 named volume

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: crawagent:latest
    container_name: crawagent-backend
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      - CRAWAGENT_PROJECT_ROOT=/app
      - TZ=Asia/Shanghai
    volumes:
      # .env 文件 bind mount — pydantic-settings 读 /app/.env，
      # 后端 API（settings.py）删模型时写回这个文件，容器内实时生效
      - .env:/app/.env
      - crawagent-data:/app/data
      - crawagent-output:/app/output
      - crawagent-downloads:/app/downloads
      - crawagent-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 可选：独立前端容器（Nginx 托管 web/dist，与后端分离）
  # 取消注释前先：cd web && npm install && npm run build
  # frontend:
  #   image: nginx:alpine
  #   container_name: crawagent-frontend
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./web/dist:/usr/share/nginx/html:ro
  #     - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  crawagent-data:
    driver: local
  crawagent-output:
    driver: local
  crawagent-downloads:
    driver: local
  crawagent-logs:
    driver: local
