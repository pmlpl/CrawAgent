[project]
name = "crawagent"
version = "0.1.0"
description = "基于 LangChain + LangGraph 的智能爬虫 Agent"
requires-python = ">=3.11"
dependencies = [
    # Agent 调度层
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai>=1.5.1",
    # openai 3.x：langchain-openai 1.5.1+ 已放开约束（>=2.45.0,<4.0.0）。
    # 早期 <3.0.0 pin 是因为魔改版 httpx2 劫持命名空间（SyncByteStream 断言失败），
    # 官方 3.x 已修复 httpx 兼容性。
    "openai>=3.0.0",
    # LLM 调用链路追踪（LangSmith）
    "langsmith>=0.1.0",
    # 爬虫工具层
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "fake-useragent>=1.5.0",
    # HTML → Markdown 转换：extract_content / browse_and_crawl 的输出格式依赖它
    "html2text>=2024.2.26",
    # 配置与校验
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Phase 3: 站点档案 YAML 化（per-domain profiles/*.yaml 支持 git diff）
    "pyyaml>=6.0",
    # 存储（Demo 阶段用 SQLite，标准库自带）
    # 后续升级：mysql-connector-python（MySQL）
    # 日志
    "loguru>=0.7.0",
    "yt-dlp>=2026.8.19",
    # HTTP async client（bilibili_tool 029 async IO 改造）
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# 扩展可选：API 封装
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
# 扩展可选：浏览器渲染 + 字体解密（番茄小说等字体加密站点）
browser = [
    "playwright>=1.40.0",
    "fonttools>=4.47.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "brotli>=1.1.0",  # woff2 字体解码
]
# 扩展可选：分布式爬虫（Redis checkpointer + 任务队列 + worker）
dist = [
    "redis>=5.2.1",
    "langgraph-checkpoint-redis>=0.5.2",
]
# 扩展可选：Android 逆向（frida hook）
# 不在 pyproject.toml 声明——frida-tools 的 websockets 依赖约束与主环境冲突，
# 会让 uv 解析整个项目时失败。改由用户按需手动安装：
#   pip install frida frida-tools
# android_reverse_tool.py 用 subprocess 调 frida CLI，不需要 Python import；
# _check_binary 在工具调用时检查存在性并给出安装提示。

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
crawagent = "crawagent.cli:main"
crawagent-dist-worker = "crawagent.dist.cli:main"

[tool.setuptools.packages.find]
include = ["crawagent*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",          # FastAPI TestClient 需要
    "pyright>=1.1.380",     # 类型检查（选 pyright 不选 mypy：Pydantic v2 + LangChain 兼容性更好）
]
type-stubs = [
    "types-requests",
    "types-beautifulsoup4",
    "types-html5lib",
    "types-Pillow",
]

[tool.pyright]
include = ["crawagent", "tests", "scripts"]
exclude = ["**/__pycache__", "crawagent/prompts/**", "crawagent/tools/seagull_overlay.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
