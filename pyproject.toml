[project]
name = "crawagent"
version = "1.0.0"
description = "智能爬虫 Agent - 基于 LLM Agent 的专业爬虫系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 核心框架
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",

    # HTTP 客户端
    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",

    # HTML 解析
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.0",
    "lxml>=5.0.0",
    "w3lib>=2.0.0",

    # 配置与序列化
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # 数据库（MySQL + SQLite 兼容）
    "aiosqlite>=0.19.0",
    "aiomysql>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.0",

    # 缓存与队列
    "redis>=5.0.0",

    # 并发与重试
    "tenacity>=8.0.0",

    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",

    # 日志
    "loguru>=0.7.0",
    "structlog>=24.0.0",

    # 工具
    "xxhash>=3.4.0",
    "msgspec>=0.18.0",
]

[project.optional-dependencies]
# 浏览器自动化
browser = [
    "playwright>=1.40.0",
    "patchright>=1.0.0",
]

# 反爬与指纹
stealth = [
    "curl-cffi>=0.7.0",
    "browserforge>=0.14.0",
]

# 数据处理
data = [
    "pandas>=2.0.0",
    "orjson>=3.9.0",
]

# 完整安装
all = ["crawagent[browser,stealth,data]"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crawagent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]