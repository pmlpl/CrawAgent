[project]
name = "crawagent"
version = "0.1.0"
description = "基于 LangChain + LangGraph 的智能爬虫 Agent"
requires-python = ">=3.11"
dependencies = [
    # Agent 调度层
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-openai>=1.0.0",
    # 显式锁定 openai：避免安装到被篡改的版本（魔改版用 httpx2 替代 httpx，
    # 会劫持 httpx 命名空间并触发 SyncByteStream 断言失败 → APIConnectionError）
    "openai>=2.26.0,<3.0.0",

    # LLM 调用链路追踪（LangSmith）
    "langsmith>=0.1.0",

    # 爬虫工具层
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "fake-useragent>=1.5.0",

    # 配置与校验
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # 存储（Demo 阶段用 SQLite，标准库自带）
    # 后续升级：mysql-connector-python（MySQL）

    # 日志
    "loguru>=0.7.0",
]

[project.optional-dependencies]
# 扩展可选：API 封装
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
# 扩展可选：浏览器渲染 + 字体解密（番茄小说等字体加密站点）
browser = [
    "playwright>=1.40.0",
    "fonttools>=4.47.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "brotli>=1.1.0",  # woff2 字体解码
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crawagent*"]
