name: CI
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --group dev --group type-stubs --all-extras
      - env: { OPENAI_API_KEY: "sk-fake-for-ci-only" }
        run: uv run pytest tests/ -v --color=yes -p no:cacheprovider

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --group dev --group type-stubs --all-extras
      - run: |
          set -o pipefail
          uv run pyright --outputjson > pyright-report.json || true
          ERRORS=$(python -c "import json;d=json.load(open('pyright-report.json'));print(sum(1 for g in d.get('generalDiagnostics',[]) if g.get('severity')=='error') + sum(1 for f in d.get('files',{}).values() for x in f.get('diagnostics',[]) if x.get('severity')=='error'))")
          echo "pyright errors: $ERRORS"
          [ "$ERRORS" -le 300 ]

  test-frontend:
    runs-on: ubuntu-latest
    continue-on-error: true  # jsdom 30 + Node 24 undici 兼容问题待修
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build
