<svg width="100%" viewBox="0 0 680 446" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CrawAgent 抓取降级链路</title>
<desc>静态抓取后经置信度评分，低于 60 分升级为浏览器渲染重抓，连续失败后强制切换到自定义脚本</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="60" y="40" width="280" height="56" rx="10" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="80" y="60" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7" dominant-baseline="central">crawl_webpage</text>
<text x="80" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" dominant-baseline="central">requests 静态抓取 · UA 轮换 · 请求限速</text>
</g>

<g>
<rect x="60" y="150" width="280" height="56" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="80" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#B5D4F4" dominant-baseline="central">extract_content</text>
<text x="80" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#85B7EB" dominant-baseline="central">html2text 转 Markdown + 置信度评分（0-100）</text>
</g>

<g>
<rect x="60" y="260" width="280" height="56" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="80" y="280" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#B5D4F4" dominant-baseline="central">browse_and_crawl</text>
<text x="80" y="298" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#85B7EB" dominant-baseline="central">Playwright 渲染后重新提取一次</text>
</g>

<g>
<rect x="60" y="370" width="280" height="56" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="80" y="390" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#B5D4F4" dominant-baseline="central">run_custom_script</text>
<text x="80" y="408" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#85B7EB" dominant-baseline="central">子进程执行 AI 自写脚本（5-120 秒）</text>
</g>

<g>
<rect x="400" y="150" width="220" height="56" rx="10" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="420" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7" dominant-baseline="central">save_record / save_to_file</text>
<text x="420" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" dominant-baseline="central">落库或落盘，回写站点档案</text>
</g>

<path d="M200 96 V150" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 178 H400" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M200 206 V260" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M200 316 V370" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="370" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#444441" dominant-baseline="central">score ≥ 60</text>
<text x="212" y="236" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">score &lt; 60 → 自动升级</text>
<text x="212" y="346" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#185FA5" dominant-baseline="central">连续 3 次失败 → 强制切换</text>
</svg>
